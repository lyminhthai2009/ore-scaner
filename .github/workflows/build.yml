name: Build Ore Scanner Mod

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Lấy code về
        uses: actions/checkout@v4

      - name: Cài đặt Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Thay đổi ở đây: Ép GitHub cài Gradle 8.7 thay vì dùng wrapper
      - name: Cài đặt Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # Thay đổi ở đây: Dùng lệnh 'gradle' trực tiếp thay vì './gradlew'
      - name: Tiến hành Build
        run: gradle build

      - name: Tải file Mod lên
        uses: actions/upload-artifact@v4
        with:
          name: OreScanner-Mod-File
          path: build/libs/*.jar
          if-no-files-found: error

